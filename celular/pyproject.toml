[project]
name = "migrador-playlists"
version = "1.4.0"
description = "Migrador de Playlists: Spotify e YouTube Music nos dois sentidos."
requires-python = ">=3.12,<3.14"
dependencies = [
    "flet==1.0.3",
    "ytmusicapi",
    "spotipy",
    "requests",
]

[dependency-groups]
dev = [
    "flet-cli==1.0.3",
]

[tool.flet]
org = "dev.deadbynetsu"
product = "Migrador de Playlists"
company = "deadbynetsu"
copyright = "Feito por deadbynetsu"
icon_background = "#080A0F"

[tool.flet.app]
path = "src"
module = "mobile_app_resilient.py"

[tool.flet.android]
adaptive_icon_background = "#080A0F"

[tool.flet.android.splash]
color = "#080A0F"
dark_color = "#080A0F"

[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.ACCESS_NETWORK_STATE" = true
