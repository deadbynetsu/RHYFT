[project]
name = "migrador-playlists"
version = "1.5.0"
description = "RHYFT: Spotify e YouTube Music nos dois sentidos."
requires-python = ">=3.12,<3.14"
dependencies = [
    "flet==1.0.3",
    "ytmusicapi",
    "spotipy",
    "requests",
]

[dependency-groups]
dev = [
    "flet-cli==1.0.3",
]

[tool.flet]
org = "dev.deadbynetsu"
product = "RHYFT"
company = "deadbynetsu"
copyright = "Feito por deadbynetsu"
icon_background = "#080A0F"

[tool.flet.app]
path = "src"
module = "mobile_app_resilient.py"

[tool.flet.android]
adaptive_icon_background = "#080A0F"

[tool.flet.android.splash]
color = "#080A0F"
dark_color = "#080A0F"

[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.ACCESS_NETWORK_STATE" = true

# jni_flutter 1.0.4+1 generates bindings for jni ^1.1.0 while this
# Flet/Flutter toolchain resolves jni 1.0.x. Keep the compatible plugin.
[tool.flet.flutter.pubspec.dependency_overrides]
jni_flutter = "1.0.3"
