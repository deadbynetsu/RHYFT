<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc">
  <title id="title">RHYFT</title>
  <desc id="desc">RHYFT — Your music. No borders.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080a10"/>
      <stop offset="0.55" stop-color="#0d1019"/>
      <stop offset="1" stop-color="#11121b"/>
    </linearGradient>
    <radialGradient id="cyanAura" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(255 150) rotate(16) scale(270 210)">
      <stop stop-color="#19e6d4" stop-opacity=".22"/>
      <stop offset="1" stop-color="#19e6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pinkAura" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(430 260) rotate(-12) scale(320 210)">
      <stop stop-color="#ff3b83" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ff3b83" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#08b8b0"/>
      <stop offset=".55" stop-color="#27e4d3"/>
      <stop offset="1" stop-color="#6ef6ed"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff927f"/>
      <stop offset=".5" stop-color="#ff5570"/>
      <stop offset="1" stop-color="#ff2e8f"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#27e4d3" stop-opacity="0"/>
      <stop offset=".25" stop-color="#27e4d3" stop-opacity=".8"/>
      <stop offset=".7" stop-color="#ff5570" stop-opacity=".75"/>
      <stop offset="1" stop-color="#ff5570" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="1384" height="344" rx="42" fill="url(#bg)" stroke="#252936" stroke-width="2"/>
  <rect x="8" y="8" width="1384" height="344" rx="42" fill="url(#cyanAura)"/>
  <rect x="8" y="8" width="1384" height="344" rx="42" fill="url(#pinkAura)"/>

  <g transform="translate(92 44) scale(.265)">
    <g filter="url(#glow)">
      <path d="M154 404 C272 422 344 347 425 265 C510 179 622 153 731 216" fill="none" stroke="url(#cyan)" stroke-width="116" stroke-linecap="round"/>
      <path d="M704 118 L900 254 L704 390 Z" fill="url(#cyan)"/>
      <path d="M858 622 C735 708 620 751 489 713 C392 684 311 612 226 628" fill="none" stroke="url(#pink)" stroke-width="118" stroke-linecap="round"/>
      <path d="M239 526 L58 645 L242 772 Z" fill="url(#pink)"/>
    </g>
    <rect x="344" y="444" width="54" height="126" rx="27" fill="#37e6d2"/>
    <rect x="427" y="386" width="62" height="244" rx="31" fill="#40ead8"/>
    <rect x="516" y="330" width="68" height="356" rx="34" fill="#d9fff7"/>
    <rect x="611" y="395" width="62" height="230" rx="31" fill="#ff718c"/>
    <rect x="700" y="451" width="54" height="120" rx="27" fill="#ff4f83"/>
  </g>

  <g transform="translate(470 0)">
    <text x="0" y="168" fill="#f7f9ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="112" font-weight="800" letter-spacing="14">RHYFT</text>
    <text x="4" y="226" fill="#a8afc0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="500" letter-spacing="2.5">YOUR MUSIC. NO BORDERS.</text>
    <rect x="4" y="258" width="720" height="3" rx="2" fill="url(#line)"/>
    <text x="4" y="310" fill="#7f8798" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="500">Spotify ⇄ YouTube Music · Windows · Android · Web</text>
  </g>
</svg>
