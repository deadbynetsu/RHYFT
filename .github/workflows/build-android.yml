name: Build Android (APK)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Um núcleo só: o celular usa o MESMO nucleo.py do app do computador.
      - name: Copiar o núcleo para o app de celular
        id: versao
        run: |
          cp nucleo.py celular/src/nucleo.py
          echo "numero=$(grep -oP "APP_VERSION = '\K[^']+" nucleo.py)" >> "$GITHUB_OUTPUT"

      - name: Build APK
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          working-directory: celular
          runner-python-version: "3.13"
          bundled-python-version: "3.13"
          build-version: ${{ steps.versao.outputs.numero }}
          build-number: ${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.build.outputs.archive-path }}
          archive: false
          if-no-files-found: error

  # iPhone: precisa de macOS e de uma conta Apple Developer (paga) para assinar. Veja celular/README.md.
