name: Build Android (APK)

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]
    paths:
      - "nucleo.py"
      - "celular/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      YT_OAUTH_CLIENT_ID: ${{ secrets.YT_OAUTH_CLIENT_ID }}
      YT_OAUTH_CLIENT_SECRET: ${{ secrets.YT_OAUTH_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v6

      - name: Preparar identidade visual do Android
        run: |
          python -m pip install --quiet cairosvg
          python - <<'PY'
          from pathlib import Path
          from cairosvg import svg2png

          assets = Path('celular/src/assets')
          assets.mkdir(parents=True, exist_ok=True)
          origem = assets / 'brand.svg'
          if not origem.exists():
              raise SystemExit('Logo celular/src/assets/brand.svg não encontrada.')

          svg2png(
              url=str(origem),
              write_to=str(assets / 'icon.png'),
              output_width=1024,
              output_height=1024,
          )
          svg2png(
              url=str(origem),
              write_to=str(assets / 'splash.png'),
              output_width=1024,
              output_height=1024,
          )
          print('Logo, ícone e splash Android preparados.')
          PY

      - name: Configurar assinatura fixa (se houver segredos)
        if: env.KEYSTORE_B64 != ''
        run: |
          faltando=""
          if [ -z "$KEYSTORE_PASSWORD" ]; then faltando="$faltando ANDROID_KEYSTORE_PASSWORD"; fi
          if [ -z "$KEY_PASSWORD" ]; then faltando="$faltando ANDROID_KEY_PASSWORD"; fi
          if [ -z "$KEY_ALIAS" ]; then faltando="$faltando ANDROID_KEY_ALIAS"; fi
          if [ -n "$faltando" ]; then
            echo "::error title=Segredos incompletos::Faltam:$faltando"
            exit 1
          fi
          if ! printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/migrador-chave.jks" 2>/dev/null || [ ! -s "$RUNNER_TEMP/migrador-chave.jks" ]; then
            echo "::error title=Chave inválida::ANDROID_KEYSTORE_BASE64 não é base64 válido."
            exit 1
          fi
          echo "FLET_ANDROID_SIGNING_KEY_STORE=$RUNNER_TEMP/migrador-chave.jks" >> "$GITHUB_ENV"
          echo "FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "FLET_ANDROID_SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "FLET_ANDROID_SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"

      - name: Avisar sobre assinatura automática
        if: env.KEYSTORE_B64 == ''
        run: echo "::warning title=APK sem chave fixa::Configure os segredos Android descritos em celular/README.md para manter a mesma assinatura entre versões."

      - name: Preparar código compartilhado e versão
        id: versao
        run: |
          cp nucleo.py celular/src/nucleo.py
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          texto = open('nucleo.py', encoding='utf-8').read()
          m = re.search(r"APP_VERSION\s*=\s*['\"]([^'\"]+)", texto)
          if not m:
              raise SystemExit('APP_VERSION não encontrado em nucleo.py')
          print(f"numero={m.group(1)}")
          PY

      - name: Preparar OAuth do YouTube Music
        run: |
          if [ -z "$YT_OAUTH_CLIENT_ID" ]; then
            echo "::error title=Client ID ausente::O secret YT_OAUTH_CLIENT_ID não foi encontrado em Settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi
          if [ -z "$YT_OAUTH_CLIENT_SECRET" ]; then
            echo "::error title=Client Secret ausente::O secret YT_OAUTH_CLIENT_SECRET não foi encontrado em Settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi
          python - <<'PY'
          import os
          from pathlib import Path
          cid = os.environ['YT_OAUTH_CLIENT_ID'].strip()
          secret = os.environ['YT_OAUTH_CLIENT_SECRET'].strip()
          if 'apps.googleusercontent.com' not in cid:
              raise SystemExit('YT_OAUTH_CLIENT_ID inválido.')
          if not secret:
              raise SystemExit('YT_OAUTH_CLIENT_SECRET inválido.')
          Path('celular/src/yt_oauth_config.py').write_text(
              '# Gerado automaticamente durante o build. Não versionar.\n'
              + 'YT_OAUTH_CLIENT_ID = ' + repr(cid) + '\n'
              + 'YT_OAUTH_CLIENT_SECRET = ' + repr(secret) + '\n',
              encoding='utf-8',
          )
          print('Credenciais OAuth configuradas para o APK.')
          PY

      - name: Build APK
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          working-directory: celular
          runner-python-version: "3.13"
          bundled-python-version: "3.13"
          build-version: ${{ steps.versao.outputs.numero }}
          build-number: ${{ github.run_number }}

      - name: Upload Android
        uses: actions/upload-artifact@v7
        with:
          name: RHYFT-android
          path: ${{ steps.build.outputs.archive-path }}
          archive: false
          if-no-files-found: error

      - name: Preparar APK para Release
        run: |
          APK=$(find "${{ steps.build.outputs.output-path }}" -type f -name '*.apk' | head -n1)
          if [ -z "$APK" ]; then
            echo "::error::APK não encontrado no output do Flet."
            exit 1
          fi
          cp "$APK" RHYFT-android.apk
          sha256sum RHYFT-android.apk | awk '{print $1}' > RHYFT-android.apk.sha256

      - name: Publicar APK na Release da versão
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.versao.outputs.numero }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              RHYFT-android.apk \
              RHYFT-android.apk.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release delete-asset "$TAG" MigradorPlaylists-android.apk --repo "$GITHUB_REPOSITORY" -y >/dev/null 2>&1 || true
            gh release delete-asset "$TAG" MigradorPlaylists-android.apk.sha256 --repo "$GITHUB_REPOSITORY" -y >/dev/null 2>&1 || true
            echo "APK RHYFT atualizado na Release $TAG."
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gh release create "$TAG" \
              RHYFT-android.apk \
              RHYFT-android.apk.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --generate-notes
          else
            echo "::warning title=Release não encontrada::A Release $TAG ainda não existe. O APK ficou disponível nos Artifacts."
          fi
