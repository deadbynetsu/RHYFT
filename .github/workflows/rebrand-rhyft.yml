name: Rebrand project to RHYFT

on:
  push:
    branches: ["main"]
    paths:
      - ".rhyft-rebrand-trigger"

permissions:
  contents: write

jobs:
  rebrand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Aplicar rebranding
        run: python ferramentas/rebrand_rhyft.py

      - name: Commitar rebranding
        run: |
          git config user.name ".NeTsU"
          git config user.email "felipezaaroblox@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nada para alterar."
            exit 0
          fi
          git commit -m "Rebrand project to RHYFT"
          git push origin HEAD:main
