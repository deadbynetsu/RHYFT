name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]
    paths:
      - "app.py"
      - "nucleo.py"
      - "requirements.txt"
      - "build.bat"
      - "ferramentas/gerar_version_info_windows.py"
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.10,<7"

      - name: Gerar metadados do executável
        shell: pwsh
        run: python ferramentas/gerar_version_info_windows.py

      - name: Compilar RHYFT em um único EXE
        shell: pwsh
        run: |
          python -m PyInstaller `
            --clean `
            --noconfirm `
            --onefile `
            --windowed `
            --name RHYFT `
            --version-file build_meta\version_info.txt `
            --collect-all customtkinter `
            --collect-all ytmusicapi `
            --collect-all certifi `
            app.py

          if (-not (Test-Path "dist\RHYFT.exe")) {
            throw "RHYFT.exe não foi gerado"
          }

          $size = [math]::Round((Get-Item "dist\RHYFT.exe").Length / 1MB, 2)
          Write-Host "RHYFT.exe gerado com $size MB."

      - name: Testar inicialização do EXE
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist\RHYFT.exe" -PassThru
          Start-Sleep -Seconds 10
          $proc.Refresh()
          if ($proc.HasExited) {
            throw "RHYFT.exe fechou sozinho durante o teste de inicialização. Exit code: $($proc.ExitCode)"
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Write-Host "RHYFT.exe permaneceu aberto no smoke test."

      - name: Verificar build com Microsoft Defender
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist\RHYFT.exe").Path
          if (-not (Get-Command Start-MpScan -ErrorAction SilentlyContinue)) {
            Write-Warning "Microsoft Defender não está disponível neste runner."
            exit 0
          }

          Start-MpScan -ScanType CustomScan -ScanPath $exe -ErrorAction Stop
          Start-Sleep -Seconds 2
          $detections = Get-MpThreatDetection -ErrorAction SilentlyContinue | Where-Object {
            $_.Resources -and (($_.Resources -join "`n") -like "*$exe*")
          }

          if ($detections) {
            $detections | Format-List | Out-String | Write-Host
            throw "Microsoft Defender detectou uma ameaça no build."
          }

          Write-Host "Microsoft Defender: nenhuma ameaça detectada no build."

      - name: Compactar e gerar checksums
        shell: pwsh
        run: |
          if (Test-Path "RHYFT-windows.zip") { Remove-Item "RHYFT-windows.zip" -Force }
          Compress-Archive -Path "dist\RHYFT.exe" -DestinationPath "RHYFT-windows.zip" -CompressionLevel Optimal
          Copy-Item "dist\RHYFT.exe" "RHYFT.exe" -Force
          (Get-FileHash "RHYFT-windows.zip" -Algorithm SHA256).Hash.ToLower() | Out-File -Encoding ascii "RHYFT-windows.zip.sha256"
          (Get-FileHash "RHYFT.exe" -Algorithm SHA256).Hash.ToLower() | Out-File -Encoding ascii "RHYFT.exe.sha256"

      - name: Upload Windows
        uses: actions/upload-artifact@v7
        with:
          name: RHYFT-windows
          path: |
            RHYFT.exe
            RHYFT.exe.sha256
            RHYFT-windows.zip
            RHYFT-windows.zip.sha256
          if-no-files-found: error

      - name: Publicar Windows na Release da versão
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (python -c "import nucleo; print(nucleo.APP_VERSION)").Trim()
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag RHYFT.exe RHYFT.exe.sha256 RHYFT-windows.zip RHYFT-windows.zip.sha256 --repo $env:GITHUB_REPOSITORY --clobber
            gh release delete-asset $tag MigradorPlaylists-windows.zip --repo $env:GITHUB_REPOSITORY -y 2>$null
            gh release delete-asset $tag MigradorPlaylists-windows.zip.sha256 --repo $env:GITHUB_REPOSITORY -y 2>$null
            gh release delete-asset $tag MigradorPlaylists.exe.sha256 --repo $env:GITHUB_REPOSITORY -y 2>$null
            Write-Host "Windows RHYFT atualizado na Release $tag."
          } elseif ($env:GITHUB_REF -like "refs/tags/*") {
            gh release create $tag RHYFT.exe RHYFT.exe.sha256 RHYFT-windows.zip RHYFT-windows.zip.sha256 --repo $env:GITHUB_REPOSITORY --title $tag --generate-notes
          } else {
            Write-Warning "Release $tag ainda não existe; os arquivos ficaram nos Artifacts."
          }
