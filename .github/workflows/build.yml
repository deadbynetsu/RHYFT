name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]
    paths:
      - "app.py"
      - "nucleo.py"
      - "requirements.txt"
      - "build.bat"
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "nuitka>=2.7,<3" ordered-set zstandard

      - name: Compilar Windows com Nuitka/MSVC
        shell: pwsh
        run: |
          $version = (python -c "import nucleo; print(nucleo.APP_VERSION)").Trim()
          if (-not $version) { throw "APP_VERSION não encontrado" }
          $winVersion = "$version.0"

          python -m nuitka `
            --mode=standalone `
            --msvc=latest `
            --assume-yes-for-downloads `
            --windows-console-mode=disable `
            --output-dir=build-nuitka `
            --output-filename=RHYFT.exe `
            --windows-company-name=deadbynetsu `
            --windows-product-name="RHYFT" `
            --windows-file-description="RHYFT - Spotify e YouTube Music" `
            --windows-file-version="$winVersion" `
            --windows-product-version="$winVersion" `
            --include-package-data=customtkinter `
            app.py

          $compiled = Get-ChildItem build-nuitka -Directory -Filter "*.dist" | Select-Object -First 1
          if (-not $compiled) { throw "Pasta .dist do Nuitka não encontrada" }

          New-Item -ItemType Directory -Path dist -Force | Out-Null
          if (Test-Path "dist\RHYFT") { Remove-Item "dist\RHYFT" -Recurse -Force }
          Move-Item $compiled.FullName "dist\RHYFT"

          if (-not (Test-Path "dist\RHYFT\RHYFT.exe")) {
            throw "RHYFT.exe não foi gerado"
          }

      - name: Verificar build com Microsoft Defender
        shell: pwsh
        run: |
          $dist = (Resolve-Path "dist\RHYFT").Path
          if (-not (Get-Command Start-MpScan -ErrorAction SilentlyContinue)) {
            Write-Warning "Microsoft Defender não está disponível neste runner."
            exit 0
          }

          Start-MpScan -ScanType CustomScan -ScanPath $dist -ErrorAction Stop
          Start-Sleep -Seconds 2
          $detections = Get-MpThreatDetection -ErrorAction SilentlyContinue | Where-Object {
            $_.Resources -and (($_.Resources -join "`n") -like "*$dist*")
          }

          if ($detections) {
            $detections | Format-List | Out-String | Write-Host
            throw "Microsoft Defender detectou uma ameaça no build."
          }

          Write-Host "Microsoft Defender: nenhuma ameaça detectada no build."

      - name: Compactar e gerar checksums
        shell: pwsh
        run: |
          Compress-Archive -Path dist\RHYFT -DestinationPath RHYFT-windows.zip -CompressionLevel Optimal
          (Get-FileHash RHYFT-windows.zip -Algorithm SHA256).Hash.ToLower() | Out-File -Encoding ascii RHYFT-windows.zip.sha256
          (Get-FileHash dist\RHYFT\RHYFT.exe -Algorithm SHA256).Hash.ToLower() | Out-File -Encoding ascii RHYFT.exe.sha256

      - name: Upload Windows
        uses: actions/upload-artifact@v7
        with:
          name: RHYFT-windows
          path: |
            RHYFT-windows.zip
            RHYFT-windows.zip.sha256
            RHYFT.exe.sha256
          if-no-files-found: error

      - name: Publicar Windows na Release da versão
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (python -c "import nucleo; print(nucleo.APP_VERSION)").Trim()
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag RHYFT-windows.zip RHYFT-windows.zip.sha256 RHYFT.exe.sha256 --repo $env:GITHUB_REPOSITORY --clobber
            gh release delete-asset $tag MigradorPlaylists-windows.zip --repo $env:GITHUB_REPOSITORY -y 2>$null
            gh release delete-asset $tag MigradorPlaylists-windows.zip.sha256 --repo $env:GITHUB_REPOSITORY -y 2>$null
            gh release delete-asset $tag MigradorPlaylists.exe.sha256 --repo $env:GITHUB_REPOSITORY -y 2>$null
            Write-Host "Windows RHYFT atualizado na Release $tag."
          } elseif ($env:GITHUB_REF -like "refs/tags/*") {
            gh release create $tag RHYFT-windows.zip RHYFT-windows.zip.sha256 RHYFT.exe.sha256 --repo $env:GITHUB_REPOSITORY --title $tag --generate-notes
          } else {
            Write-Warning "Release $tag ainda não existe; os arquivos ficaram nos Artifacts."
          }
