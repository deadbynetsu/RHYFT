name: Gerar versão para Windows

on:
  push:
    tags: ['v*']        # ex.: v1.0.0
  workflow_dispatch:     # permite rodar na mão pela aba Actions

permissions:
  contents: write        # necessário para publicar no Releases

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Compilar em pasta (onedir), que dá menos falso positivo em antivírus
        run: python -m PyInstaller --noconsole --onedir --name MigradorPlaylists --collect-all customtkinter --collect-all ytmusicapi app.py

      - name: Compactar e gerar checksum
        shell: pwsh
        run: |
          Compress-Archive -Path dist\MigradorPlaylists -DestinationPath MigradorPlaylists-windows.zip
          (Get-FileHash MigradorPlaylists-windows.zip -Algorithm SHA256).Hash | Out-File -Encoding ascii MigradorPlaylists-windows.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: MigradorPlaylists-windows
          path: |
            MigradorPlaylists-windows.zip
            MigradorPlaylists-windows.zip.sha256

      - name: Publicar no Releases (só quando for uma tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MigradorPlaylists-windows.zip
            MigradorPlaylists-windows.zip.sha256
          generate_release_notes: true
