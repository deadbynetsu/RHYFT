name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]
    paths:
      - "app.py"
      - "nucleo.py"
      - "requirements.txt"
      - "build.bat"
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "nuitka>=2.7,<3" ordered-set zstandard

      - name: Compilar Windows com Nuitka/MSVC
        shell: pwsh
        run: |
          $version = (python -c "import nucleo; print(nucleo.APP_VERSION)").Trim()
          if (-not $version) { throw "APP_VERSION não encontrado" }
          $winVersion = "$version.0"

          python -m nuitka `
            --mode=standalone `
            --msvc=latest `
            --assume-yes-for-downloads `
            --windows-console-mode=disable `
            --output-dir=build-nuitka `
            --output-filename=MigradorPlaylists.exe `
            --windows-company-name=deadbynetsu `
            --windows-product-name="Migrador de Playlists" `
            --windows-file-description="Migrador Spotify e YouTube Music" `
            --windows-file-version="$winVersion" `
            --windows-product-version="$winVersion" `
            --include-package-data=customtkinter `
            app.py

          $compiled = Get-ChildItem build-nuitka -Directory -Filter "*.dist" | Select-Object -First 1
          if (-not $compiled) { throw "Pasta .dist do Nuitka não encontrada" }

          New-Item -ItemType Directory -Path dist -Force | Out-Null
          if (Test-Path "dist\MigradorPlaylists") { Remove-Item "dist\MigradorPlaylists" -Recurse -Force }
          Move-Item $compiled.FullName "dist\MigradorPlaylists"

          if (-not (Test-Path "dist\MigradorPlaylists\MigradorPlaylists.exe")) {
            throw "MigradorPlaylists.exe não foi gerado"
          }

      - name: Verificar build com Microsoft Defender
        shell: pwsh
        run: |
          $dist = (Resolve-Path "dist\MigradorPlaylists").Path
          if (-not (Get-Command Start-MpScan -ErrorAction SilentlyContinue)) {
            Write-Warning "Microsoft Defender não está disponível neste runner."
            exit 0
          }

          Start-MpScan -ScanType CustomScan -ScanPath $dist -ErrorAction Stop
          Start-Sleep -Seconds 2
          $detections = Get-MpThreatDetection -ErrorAction SilentlyContinue | Where-Object {
            $_.Resources -and (($_.Resources -join "`n") -like "*$dist*")
          }

          if ($detections) {
            $detections | Format-List | Out-String | Write-Host
            throw "Microsoft Defender detectou uma ameaça no build."
          }

          Write-Host "Microsoft Defender: nenhuma ameaça detectada no build."

      - name: Compactar e gerar checksums
        shell: pwsh
        run: |
          Compress-Archive -Path dist\MigradorPlaylists -DestinationPath MigradorPlaylists-windows.zip -CompressionLevel Optimal
          (Get-FileHash MigradorPlaylists-windows.zip -Algorithm SHA256).Hash.ToLower() | Out-File -Encoding ascii MigradorPlaylists-windows.zip.sha256
          (Get-FileHash dist\MigradorPlaylists\MigradorPlaylists.exe -Algorithm SHA256).Hash.ToLower() | Out-File -Encoding ascii MigradorPlaylists.exe.sha256

      - name: Upload Windows
        uses: actions/upload-artifact@v7
        with:
          name: MigradorPlaylists-windows
          path: |
            MigradorPlaylists-windows.zip
            MigradorPlaylists-windows.zip.sha256
            MigradorPlaylists.exe.sha256
          if-no-files-found: error

      - name: Publicar no Release quando houver tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MigradorPlaylists-windows.zip
            MigradorPlaylists-windows.zip.sha256
            MigradorPlaylists.exe.sha256
          generate_release_notes: true
