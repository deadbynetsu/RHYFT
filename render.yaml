# Blueprint for the Web service in the primary RHYFT repository.
# Linking it to a Render account and deploying remain separate actions.
services:
  - type: web
    name: rhyft-web
    repo: https://github.com/deadbynetsu/RHYFT
    branch: main
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.web
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      paths:
        - site/**
        - netlify/functions/**
        - web-server.cjs
        - Dockerfile.web
        - Dockerfile.web.dockerignore
        - render.yaml
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: NETLIFY_DEV
        value: "false"
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
    # SPOTIFY_CLIENT_ID may be added in the dashboard for the shared app.
    # Without it, users can continue connecting with their personal Client ID.
